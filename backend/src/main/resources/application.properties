spring.application.name=voting-system

spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ---- Database (no secrets in the repo: values come from environment variables) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/voting_db?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema; Hibernate never changes it
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ---- Security ----
# Base64-encoded key, at least 32 bytes. Generate with: openssl rand -base64 32
#app.jwt.secret=${JWT_SECRET}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Optional first admin account, created only if it does not exist yet
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}

# ---- Don't leak internals in error responses ----
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---- Actuator: health only ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
